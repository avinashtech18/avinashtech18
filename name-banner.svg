<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Avinash A - Java, Full-Stack, Cloud, AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#0f3d4c"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-900" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.35" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#e0f2fe"/>
      <stop offset="0.65" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#14b8a6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1800 0" dur="4s" begin="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="896" height="236" rx="18" fill="url(#bg)" stroke="#14b8a6" stroke-opacity="0.5" stroke-width="2"/>
  <g fill="#5eead4" fill-opacity="0.12">
    <circle cx="70" cy="60" r="3"><animate attributeName="fill-opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="180" r="4"><animate attributeName="fill-opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="50" r="2.5"><animate attributeName="fill-opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="190" r="2.5"><animate attributeName="fill-opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="450" y="125" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="14" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="1400" stroke-dashoffset="1400">
    AVINASH A
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.6s" fill="freeze"/>
    <animate attributeName="stroke-opacity" from="1" to="0" begin="2.4s" dur="0.8s" fill="freeze"/>
  </text>
  <text x="450" y="125" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="14" fill="url(#shine)" fill-opacity="0">
    AVINASH A
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.4s" dur="0.8s" fill="freeze"/>
  </text>
  <line x1="300" y1="152" x2="600" y2="152" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="2.8s" dur="0.8s" fill="freeze"/>
  </line>
  <text x="450" y="192" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="22" fill="#e0f2fe" fill-opacity="0">
    JAVA  •  FULL-STACK  •  CLOUD  •  AI
    <animate attributeName="fill-opacity" from="0" to="0.9" begin="3.3s" dur="0.9s" fill="freeze"/>
  </text>
</svg>
